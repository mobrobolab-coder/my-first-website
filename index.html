    <script>
    const car = document.querySelector('.car');
    const oblasts = document.querySelectorAll('.obl');

    function checkCollision() {
        const carRect = car.getBoundingClientRect();

        oblasts.forEach(obl => {
            const oblRect = obl.getBoundingClientRect();

            const hit = !(
                carRect.right  < oblRect.left  ||
                carRect.left   > oblRect.right ||
                carRect.bottom < oblRect.top   ||
                carRect.top    > oblRect.bottom
            );

            obl.classList.toggle('car-touch', hit);
        });

        requestAnimationFrame(checkCollision);
    }

    requestAnimationFrame(checkCollision);
</script>
